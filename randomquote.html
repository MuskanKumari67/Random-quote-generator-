<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .quote-box {
            background: #f5f5f5;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        #quote {
            font-size: 24px;
            font-style: italic;
            color: #444;
            margin-bottom: 15px;
        }

        #author {
            color: #667eea;
            font-size: 18px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4f63d2;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Random Quote Generator</h1>

        <div class="quote-box">
            <p id="quote">
                Click the button to get a random quote!
            </p>

            <h3 id="author"></h3>
        </div>

        <button id="quoteBtn">
            New Quote
        </button>

    </div>


    <script>

        // Getting HTML elements
        const quote = document.getElementById("quote");
        const author = document.getElementById("author");
        const quoteBtn = document.getElementById("quoteBtn");


        // Function to fetch random quote
        async function getQuote() {

            try {

                quote.textContent = "Loading...";
                author.textContent = "";

                // Fetch API
                const response = await fetch(
                    "https://dummyjson.com/quotes/random"
                );

                // Convert response into JSON
                const data = await response.json();

                // Display quote
                quote.textContent = `"${data.quote}"`;

                // Display author
                author.textContent = `— ${data.author}`;

            } 
            catch (error) {

                quote.textContent = "Failed to fetch quote.";
                author.textContent = "";

                console.log(error);
            }
        }


        // Button click event
        quoteBtn.addEventListener("click", getQuote);

    </script>

</body>
</html>
